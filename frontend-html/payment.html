<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Movie Booking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0c0c1d 0%, #1a1a2e 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px solid #00adb5;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #00adb5;
        }
        
        .progress-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            gap: 20px;
        }
        
        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #666;
        }
        
        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .progress-step.active .step-circle {
            background: #00adb5;
            color: white;
        }
        
        .progress-step.active {
            color: #00adb5;
        }
        
        .step-line {
            width: 80px;
            height: 2px;
            background: #333;
        }
        
        .progress-step.active + .step-line {
            background: #00adb5;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        .booking-summary {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 10px;
        }
        
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .summary-item.total {
            border-top: 2px solid #00adb5;
            font-size: 24px;
            font-weight: bold;
            color: #00adb5;
            margin-top: 20px;
        }
        
        .payment-methods {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 10px;
        }
        
        .method-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .method-tab {
            flex: 1;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            font-weight: bold;
        }
        
        .method-tab.active {
            background: #00adb5;
        }
        
        .payment-form {
            display: none;
        }
        
        .payment-form.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .upi-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .upi-option {
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .upi-option:hover, .upi-option.active {
            background: #00adb5;
        }
        
        .wallet-options {
            display: grid;
            gap: 10px;
        }
        
        .wallet-option {
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .wallet-option:hover, .wallet-option.active {
            background: #00adb5;
        }
        
        .wallet-logo {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-weight: bold;
        }
        
        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            grid-column: 1 / -1;
        }
        
        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        
        .btn-back {
            background: #666;
            color: white;
        }
        
        .btn-pay {
            background: #00adb5;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .actions {
                flex-direction: column;
                gap: 15px;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">CINEMAX</div>
        <div class="user-menu">
            <a href="login.html" style="color: white; text-decoration: none; margin-left: 20px;">Login</a>
        </div>
    </div>

    <div class="progress-bar">
        <div class="progress-step">
            <div class="step-circle">1</div>
            <div>Theater</div>
        </div>
        <div class="step-line"></div>
        <div class="progress-step">
            <div class="step-circle">2</div>
            <div>Seats</div>
        </div>
        <div class="step-line"></div>
        <div class="progress-step active">
            <div class="step-circle">3</div>
            <div>Payment</div>
        </div>
        <div class="step-line"></div>
        <div class="progress-step">
            <div class="step-circle">4</div>
            <div>Confirm</div>
        </div>
    </div>

    <div class="container">
        <div class="booking-summary">
            <h2>Booking Summary</h2>
            <div class="summary-item">
                <span>Movie:</span>
                <span id="summaryMovie">Loading...</span>
            </div>
            <div class="summary-item">
                <span>Theater:</span>
                <span id="summaryTheater">Loading...</span>
            </div>
            <div class="summary-item">
                <span>Date & Time:</span>
                <span id="summaryTime">Loading...</span>
            </div>
            <div class="summary-item">
                <span>Seats:</span>
                <span id="summarySeats">Loading...</span>
            </div>
            <div class="summary-item">
                <span>Ticket Price:</span>
                <span>₹<span id="summaryTicketPrice">0</span></span>
            </div>
            <div class="summary-item">
                <span>Convenience Fee:</span>
                <span>₹<span id="summaryFee">0</span></span>
            </div>
            <div class="summary-item total">
                <span>Total Amount:</span>
                <span>₹<span id="summaryTotal">0</span></span>
            </div>
        </div>

        <div class="payment-methods">
            <h2>Select Payment Method</h2>
            
            <div class="method-tabs">
                <button class="method-tab active" data-method="card">💳 Credit/Debit Card</button>
                <button class="method-tab" data-method="upi">📱 UPI</button>
                <button class="method-tab" data-method="wallet">💰 Wallet</button>
            </div>

            <div class="payment-form active" id="card-form">
                <div class="form-group">
                    <label for="cardNumber">Card Number</label>
                    <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="expiryDate">Expiry Date</label>
                        <input type="text" id="expiryDate" placeholder="MM/YY" maxlength="5">
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <input type="password" id="cvv" placeholder="123" maxlength="3">
                    </div>
                </div>
                <div class="form-group">
                    <label for="cardName">Name on Card</label>
                    <input type="text" id="cardName" placeholder="John Doe">
                </div>
            </div>

            <div class="payment-form" id="upi-form">
                <div class="upi-options">
                    <div class="upi-option active" data-upi="gpay">GPay</div>
                    <div class="upi-option" data-upi="phonepe">PhonePe</div>
                    <div class="upi-option" data-upi="paytm">Paytm</div>
                    <div class="upi-option" data-upi="other">Other</div>
                </div>
                <div class="form-group">
                    <label for="upiId">UPI ID</label>
                    <input type="text" id="upiId" placeholder="username@upi">
                </div>
            </div>

            <div class="payment-form" id="wallet-form">
                <div class="wallet-options">
                    <div class="wallet-option active">
                        <div class="wallet-logo">P</div>
                        <div>Paytm Wallet</div>
                    </div>
                    <div class="wallet-option">
                        <div class="wallet-logo">A</div>
                        <div>Amazon Pay</div>
                    </div>
                    <div class="wallet-option">
                        <div class="wallet-logo">M</div>
                        <div>MobiKwik</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-back" onclick="goBack()">← Back to Seats</button>
            <button class="btn btn-pay" onclick="processPayment()">Pay Now</button>
        </div>
    </div>

    <script>
        // Load booking summary from localStorage
        function loadBookingSummary() {
            const movie = localStorage.getItem('selectedMovie') || 'The Dark Knight';
            const theater = localStorage.getItem('selectedTheater') || 'PVR Cinemas';
            const date = localStorage.getItem('selectedDate') || 'Today';
            const time = localStorage.getItem('selectedShowtime') || '08:00 PM';
            const seatsRaw = localStorage.getItem('selectedSeats');
            const totalPrice = localStorage.getItem('totalPrice') || '0';
            
            let seatsText = 'A1, A2, A3';
            if (seatsRaw) {
                try {
                    const seats = JSON.parse(seatsRaw);
                    seatsText = Array.isArray(seats) ? seats.join(', ') : seatsRaw;
                } catch (e) {
                    seatsText = seatsRaw;
                }
            }
            
            document.getElementById('summaryMovie').textContent = movie;
            document.getElementById('summaryTheater').textContent = theater;
            document.getElementById('summaryTime').textContent = `${date}, ${time}`;
            document.getElementById('summarySeats').textContent = seatsText;
            document.getElementById('summaryTicketPrice').textContent = totalPrice;
            
            const ticketPrice = parseInt(totalPrice) || 0;
            const convenienceFee = Math.round(ticketPrice * 0.1);
            const finalTotal = ticketPrice + convenienceFee;
            
            document.getElementById('summaryFee').textContent = convenienceFee;
            document.getElementById('summaryTotal').textContent = finalTotal;
            
            localStorage.setItem('finalAmount', finalTotal);
            
            console.log('✅ Payment page loaded with:', {
                movie, theater, date, time, seatsText, totalPrice, finalTotal
            });
        }

        // Load on page load
        window.onload = loadBookingSummary;

        // Payment method tabs
        document.querySelectorAll('.method-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                const method = this.getAttribute('data-method');
                document.querySelectorAll('.method-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.payment-form').forEach(form => {
                    form.classList.remove('active');
                });
                document.getElementById(`${method}-form`).classList.add('active');
            });
        });

        // UPI options
        document.querySelectorAll('.upi-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.upi-option').forEach(o => o.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Wallet options
        document.querySelectorAll('.wallet-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.wallet-option').forEach(o => o.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Format card number
        document.getElementById('cardNumber').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
            let formatted = value.replace(/(\d{4})/g, '$1 ').trim();
            e.target.value = formatted.substring(0, 19);
        });

        // Format expiry date
        document.getElementById('expiryDate').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2, 4);
            }
            e.target.value = value.substring(0, 5);
        });

        function goBack() {
            window.location.href = 'seats.html';
        }

        function processPayment() {
            const activeMethod = document.querySelector('.method-tab.active').getAttribute('data-method');
            let isValid = true;
            
            if (activeMethod === 'card') {
                const cardNumber = document.getElementById('cardNumber').value;
                const expiryDate = document.getElementById('expiryDate').value;
                const cvv = document.getElementById('cvv').value;
                const cardName = document.getElementById('cardName').value;
                
                if (!cardNumber || !expiryDate || !cvv || !cardName) {
                    isValid = false;
                }
            } else if (activeMethod === 'upi') {
                const upiId = document.getElementById('upiId').value;
                if (!upiId || !upiId.includes('@')) {
                    isValid = false;
                }
            }
            
            if (!isValid) {
                // Silent - No alert
                return;
            }
            
            // Save payment method
            localStorage.setItem('paymentMethod', activeMethod);
            
            // Log all data before redirect
            console.log('✅ Payment processed. Redirecting to confirmation...');
            console.log('All data:', {
                movie: localStorage.getItem('selectedMovie'),
                theater: localStorage.getItem('selectedTheater'),
                seats: localStorage.getItem('selectedSeats'),
                total: localStorage.getItem('finalAmount'),
                payment: localStorage.getItem('paymentMethod')
            });
            
            // Redirect to confirmation page
            window.location.href = 'confirmation.html';
        }
    </script>
</body>
</html>
